[package]
name = "xmip-core-message-edi-x12"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/IlleNilsson/xmip-core-message-edi-x12"
description = "ASC X12 shape: an ISA interchange as segments named by their tag, the first ST01 as the announced type; the one reader of the ISA, which the X12 contract reads an interchange's head by. A xmip-core-message technology."
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# The parent capability's `Shape` (`message::shape`; repository-model.md),
# and the Stream it shapes.
message = { package = "xmip-core-message", git = "https://github.com/IlleNilsson/xmip-core-message", branch = "main" }
stream = { package = "xmip-core-stream", git = "https://github.com/IlleNilsson/xmip-core-stream", branch = "main" }

[dev-dependencies]
xcore = { package = "xmip-core", git = "https://github.com/IlleNilsson/xmip-core", branch = "main" }

[lints]
workspace = true
